name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet and dependencies
        run: |
          pip install flet flet-audio yt-dlp

      - name: Build APK
        run: |
          flet build apk --include-packages flet_audio

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yt-music-apk
          path: build/apk/*.apk
